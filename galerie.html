<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Galerie Art - SimpleArt</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Font Awesome pentru iconițe -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
</head>
<body>

    <header>
        <div class="logo">            
            <h2><a href="index.html">SimpleArt</a></h2>
        </div>
        <!-- Navigație -->
        <nav>
            <ul>
                <li><a href="index.html">Acasa</a></li>
                <li><a href="galerie.html" id="active">Galerie</a></li>
                <li><a href="about.html">Despre noi</a></li>
                <li><a href="contact.html">Contact</a></li>

            </ul>
        </nav>
        <!-- Iconiță Coș de cumpărături -->
        <div class="cart-wrapper">
            <a href="cos.html">
                <i class="fa-solid fa-cart-shopping cos-cumparaturi"></i>
            </a>
        </div>
    </header>

    <main>
        <section id="hero-gallery">
            <h1>Toate tablourile</h1>
        </section>
        <!-- Filtare și sortare -->
        <section id="filters">
            <div class="category-filters">
                <button class="btn-filter active">Toate</button>
                <button class="btn-filter">Abstract</button>
                <button class="btn-filter">Peisaje</button>
                <button class="btn-filter">Portrete</button>
            </div>
            
            <div class="sort-filters">
                <select aria-label="Sortare tablouri">
                    <option value="price-asc">Sortare după preț: mic la mare</option>
                    <option value="price-desc">Sortare după preț: mare la mic</option>
                    <option value="name">Sortare după nume</option>
                </select>

                <button class="btn-layout" aria-label="Vizualizare Grid">
                    <i class="fa-solid fa-table-cells-large"></i> 
                </button>
                <button class="btn-layout" aria-label="Vizualizare Listă">
                    <i class="fa-solid fa-list"></i> 
                </button>
            </div>
        </section>

        <section id="gallery-grid">
            <!-- Exemplu de card de produs, repetat pentru fiecare tablou din galerie -->
            <article class="product-card">
                <a href="tablou_1.html">
                    <div class="image-container">
                        <img src="assets/images/tablou_1.png" alt="Tablou Abstract - Model 1">
                    </div>
                </a>
                <div class="product-info">
                    <h4>Learning to Code</h4>
                    <p class="product-price">399 lei</p>
                </div>
            </article>

            <article class="product-card">
                <div class="image-container">
                    <img src="assets/images/tablou_2.png" alt="Tablou Peisaj - Model 2">
                </div>
                <div class="product-info">
                    <h4>True Love</h4>
                    <p class="product-price">299 lei</p>
                </div>
            </article>
             <article class="product-card">
                <div class="image-container">
                    <img src="assets/images/tablou_3.png" alt="Tablou Peisaj - Model 2">
                </div>
                <div class="product-info">
                    <h4>Colors of Nature</h4>
                    <p class="product-price">459 lei</p>
                </div>
            </article>
             <article class="product-card">
                <div class="image-container">
                    <img src="assets/images/tablou_4.png" alt="Tablou Peisaj - Model 2">
                </div>
                <div class="product-info">
                    <h4>Modern Women</h4>
                    <p class="product-price">259 lei</p>
                </div>
            </article>
             <article class="product-card">
                <div class="image-container">
                    <img src="assets/images/tablou_5.png" alt="Tablou Peisaj - Model 2">
                </div>
                <div class="product-info">
                    <h4>Abstract</h4>
                    <p class="product-price">169 lei</p>
                </div>
            </article>
             <article class="product-card">
                <div class="image-container">
                    <img src="assets/images/tablou_6.png" alt="Tablou Peisaj - Model 2">
                </div>
                <div class="product-info">
                    <h4>Pleasure of music</h4>
                    <p class="product-price">567 lei</p>
                </div>
            </article>
             <article class="product-card">
                <div class="image-container">
                    <img src="assets/images/tablou_7.png" alt="Tablou Peisaj - Model 2">
                </div>
                <div class="product-info">
                    <h4>Silence</h4>
                    <p class="product-price"> 259 lei</p>
                </div>
            </article>
             <article class="product-card">
                <div class="image-container">
                    <img src="assets/images/poza carduri.jpg" alt="Tablou Peisaj - Model 2">
                </div>
                <div class="product-info">
                    <h4>Tablou 8</h4>
                    <p class="product-price">499 lei</p>
                </div>
            </article>
            

            </section>
        <!-- Buton "Încarcă mai multe" -->
        <div class="load-more">
            <button class="btn-load">Încarcă mai multe</button>
        </div>
    </main>

    </body>
</html>
