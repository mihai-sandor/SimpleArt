<!DOCTYPE html>
<html lang="ro">
    <head>
    <meta charset="UTF-8">
    <title>Galerie Art</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>
    <body>
        <header>

            <h2>SimpleArt</h2>
            <!--Butoane de Navigare-->
            <nav>
                <ul>
                    <li><a href="index.html">Acasa</a></li>
                    <li><a href="galerie.html">Galerie</a></li>
                    <li><a href="cos.html">Cos</a></li>
                </ul>
            </nav>
            <div>
                <a href="#cos-cumparaturi"><i class="fa-solid fa-cart-shopping cos-cumparaturi"></i></a>
            </div>
        </header>
        <main>
            <section id="hero-gallery">
                <h1>Toate tablourile</h1>
            </section>
            <!-- Butoane de Filtrare -->
            <section id="filters">
                <div>
                    <button>Toate</button>
                    <button>Abstract</button>
                    <button>Peisaje</button>
                    <button>Portrete</button>
                </div>
                <div>
                    <select>
                        <option>Sortare după preț</option>
                        <option>Sortare după nume</option>
                    </select>
                    <!-- Buton pentru vizualizare Grid -->
                    <button class="btn-layout">
                        <i class="fa-solid fa-table-cells-large"></i> 
                    </button>

                    <!-- Buton pentru vizualizare Listă -->
                    <button class="btn-layout">
                        <i class="fa-solid fa-list"></i> 
                    </button>
                </div>
            </section>
            <!-- Grila cu tablouri-->
            <section id="gallery-grid">
                <div>
                    <article class="product-card">
                        <div class="image-container">
                            <img src="assets/images/poza carduri.jpg">
                            <h3>Tablou 1</h3>
                        </div>
                    </article>
                </div>
            </section>
            
</html>
